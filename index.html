<!doctype html>
<html lang="lv">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0D0B09" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Fonti ir pašhostēti caur @fontsource (src/styles/tokens.css) - ārējs preconnect nav vajadzīgs. -->

    <!--
      Atklāsmes vārti. Slēpšana notiek TIKAI tad, kad šis atribūts ir uzlikts,
      un tas netiek uzlikts pie prefers-reduced-motion. Bez JS atribūta nav,
      tāpēc nekas netiek paslēpts. Skripts ir inline un pirms lapas, lai lēmums
      ir pieņemts pirms pirmā kadra (sk. src/index.css .reveal bloku).
    -->
    <script>
      (function () {
        try {
          if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
          document.documentElement.setAttribute('data-reveal', 'on');
        } catch (e) {}
      })();
    </script>

    <!-- Google Consent Mode v2 (noklusējums - liegts) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        'ad_storage': 'denied',
        'ad_user_data': 'denied',
        'ad_personalization': 'denied',
        'analytics_storage': 'denied',
        'wait_for_update': 500
      });
    </script>

    <!-- TODO: pievienot GTM / GA4 ID, kad tie būs zināmi (services.ga4 = atlikts) -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
