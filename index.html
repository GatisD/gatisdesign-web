<!doctype html>
<html lang="lv">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0D0B09" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Fonti ir pašhostēti caur @fontsource (src/styles/tokens.css) - ārējs preconnect nav vajadzīgs. -->

    <!--
      Atklāsmes vārti. Slēpšana notiek TIKAI tad, kad šis atribūts ir uzlikts,
      un tas netiek uzlikts pie prefers-reduced-motion. Bez JS atribūta nav,
      tāpēc nekas netiek paslēpts. Skripts ir inline un pirms lapas, lai lēmums
      ir pieņemts pirms pirmā kadra (sk. src/index.css .reveal bloku).
    -->
    <script>
      (function () {
        try {
          if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
          document.documentElement.setAttribute('data-reveal', 'on');
        } catch (e) {}
      })();
    </script>

    <!-- Google Consent Mode v2 (noklusējums - liegts) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        'ad_storage': 'denied',
        'ad_user_data': 'denied',
        'ad_personalization': 'denied',
        'analytics_storage': 'denied',
        'wait_for_update': 500
      });
    </script>

    <!--
      Google Tag Manager.

      Šeit, nevis React komponentē: react-helmet-async izvadi vite-react-ssg
      ievieto <head> SĀKUMĀ, tātad PIRMS augšējā Consent Mode bloka. Konteinera
      skripts ir `async`, un async skripts drīkst izpildīties, kamēr parseris vēl
      lasa lapu, - ar siltu kešu gtm.js sāktu darbu, pirms noklusējums ir
      uzstādīts, un `wait_for_update` nekad nenostrādātu. Statisks skripts tieši
      aiz noklusējuma bloka šo sacīkšu iespēju izslēdz pavisam.

      ID nāk no `VITE_GTM_ID` - Vite to aizvieto būves laikā. Ja mainīgā nav,
      vietturis paliek neaizvietots, formas pārbaude nesakrīt un konteiners
      netiek ielādēts: dzīvā lapā tas nozīmētu 404 pieprasījumu katrā ielādē un
      tracking, kas izskatās uzstādīts, bet neko nemēra.

      Ielāde notiek pirmajā dīkstāves brīdī, ne uzreiz. gtm.js ar visiem tagiem
      ir ~110 KB JavaScript, un mobilajā mērījumā tas deva +113 ms TBT tieši
      lapas atvēršanas brīdī. Konteiners nav vajadzīgs pirmajā kadrā: notikumi
      līdz tā ielādei gaida `dataLayer` masīvā un tiek apstrādāti pēc tam.

      Consent Mode noklusējums paliek AUGŠĀ, sinhroni. Aizkave to nemaina un
      neatceļ: noklusējums ir uzstādīts jau pirms konteiners vispār pieprasīts.
    -->
    <script>
      (function () {
        var id = '%VITE_GTM_ID%';
        if (!/^GTM-[A-Z0-9]{5,}$/.test(id)) return;
        var started = false;
        function load() {
          if (started) return;
          started = true;
          (function (w, d, s, l, i) {
            w[l] = w[l] || [];
            w[l].push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
            var f = d.getElementsByTagName(s)[0],
              j = d.createElement(s),
              dl = l != 'dataLayer' ? '&l=' + l : '';
            j.async = true;
            j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + dl;
            f.parentNode.insertBefore(j, f);
          })(window, document, 'script', 'dataLayer', id);
        }
        // Pirmā cilvēka darbība ielādē konteineru uzreiz: mērķdarbība nedrīkst
        // gaidīt dīkstāvi tikai tāpēc, ka lapa vēl zīmējas.
        ['pointerdown', 'keydown', 'touchstart'].forEach(function (type) {
          window.addEventListener(type, load, { once: true, passive: true });
        });
        if ('requestIdleCallback' in window) window.requestIdleCallback(load, { timeout: 3000 });
        else window.setTimeout(load, 1500);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
